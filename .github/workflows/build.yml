name: Build OrangePi 4 Pro Image

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Ubuntu/Debian release codename'
        required: true
        default: 'resolute'
        type: choice
        options:
          - resolute
          - noble
          - jammy
          - bookworm
          - trixie
      flavour:
        description: 'Desktop flavour'
        required: true
        default: 'desktop-xfce'
        type: choice
        options:
          - desktop-xfce
          - desktop-gnome
          - desktop-lxqt
          - server
          - minimal
      target_storage:
        description: 'Target storage'
        required: true
        default: 'sd'
        type: choice
        options:
          - sd
          - nvme
          - both
      publish_release:
        description: 'Publish as a GitHub Release'
        required: true
        default: true
        type: boolean

  # Also auto-trigger when patches or workflow change
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: write

jobs:
  build:
    name: "Build — ${{ inputs.release || 'resolute' }} / ${{ inputs.flavour || 'desktop-xfce' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      - name: Free disk space on runner
        run: |
          echo "=== Disk before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/share/swift
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== Disk after cleanup ==="
          df -h

      # -----------------------------------------------------------------------
      # Register QEMU binfmt handlers for ARM64 cross-build (REQUIRED for
      # debootstrap Stage 2 — static qemu-aarch64-static must be present
      # inside the chroot so the host kernel can exec ARM64 ELFs via binfmt_misc)
      - name: Set up QEMU (ARM64 binfmt)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # -----------------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            gcc-11-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            bison flex bc libssl-dev libncurses-dev libelf-dev \
            debootstrap qemu-user-static binfmt-support u-boot-tools \
            rsync cpio kmod parted dosfstools fdisk xz-utils curl wget \
            zstd pigz python3 device-tree-compiler dialog lzop \
            libyaml-dev pkg-config libarchive-tools
          # Pin arm-linux-gnueabi-gcc to GCC 11 — U-Boot v2018.05-sun60iw2 is
          # incompatible with GCC 12+ (Ubuntu 24.04 ships GCC 15 by default).
          sudo update-alternatives --install \
            /usr/bin/arm-linux-gnueabi-gcc arm-linux-gnueabi-gcc \
            /usr/bin/arm-linux-gnueabi-gcc-11 100
          sudo update-alternatives --install \
            /usr/bin/arm-linux-gnueabi-cpp arm-linux-gnueabi-cpp \
            /usr/bin/arm-linux-gnueabi-cpp-11 100

          # U-Boot v2018.05 + GCC 11 + modern binutils (2.42) has two issues:
          # 1. PIE link failure on "LD u-boot": GCC 11 arm-linux-gnueabi may default
          #    to PIE, but the U-Boot v2018.05 linker script is not PIE-compatible.
          # 2. board/sunxi/board.c: GCC 11 treats conflicting attributes (noreturn +
          #    const on ____ilog2_NaN in include/linux/log2.h) as a warning, which
          #    -Werror turns into a fatal error.
          # Fix: thin wrapper injecting -fno-pie -no-pie -Wno-error=attributes.
          # /usr/local/bin precedes /usr/bin in PATH so it shadows the real binary.
          printf '#!/bin/sh\nexec /usr/bin/arm-linux-gnueabi-gcc-11 -fno-pie -no-pie -Wno-error=attributes "$@"\n' \
            | sudo tee /usr/local/bin/arm-linux-gnueabi-gcc > /dev/null
          sudo chmod +x /usr/local/bin/arm-linux-gnueabi-gcc

          arm-linux-gnueabi-gcc-11 --version
          /usr/local/bin/arm-linux-gnueabi-gcc --version
          arm-linux-gnueabi-ld --version

      # -----------------------------------------------------------------------
      - name: Clone orangepi-build
        run: |
          git clone --depth 1 https://github.com/orangepi-xunlong/orangepi-build.git orangepi-build

      # -----------------------------------------------------------------------
      - name: Clone A733 patch repo (jonas5/Allwinner-A733-kernel)
        run: |
          git clone --depth 1 https://github.com/jonas5/Allwinner-A733-kernel.git a733-patches

      # -----------------------------------------------------------------------
      - name: Apply orangepi-build harness patch
        run: |
          cd orangepi-build
          git apply --check ../a733-patches/patch/orangepi-build.patch \
            && git apply ../a733-patches/patch/orangepi-build.patch \
            || echo "Patch already applied or not needed, continuing."

      # -----------------------------------------------------------------------
      - name: Inject A733 kernel patches
        run: |
          PATCH_SRC="a733-patches/patch"
          # BRANCH=next → orangepi-build reads patches from sun60iw2-next
          # (KERNELPATCHDIR is set to ${BOARDFAMILY}-${BRANCH} in sun60iw2.conf,
          #  and orangepi-build.patch adds BRANCH=next + mainline 6.18 support)
          PATCH_DST="orangepi-build/external/patch/kernel/sun60iw2-next"
          mkdir -p "$PATCH_DST"

          # Core A733 patch — copy whatever patch file exists in the repo
          # (the patch repo may use different naming conventions over time)
          for f in \
            "$PATCH_SRC/0001-allwinner-a733-orangepi-4-pro-6.18-mainline.patch" \
            "$PATCH_SRC/0001-allwinner-a733-orangepi-4-pro.patch" \
          ; do
            [ -f "$f" ] && cp -v "$f" "$PATCH_DST/" && break || true
          done
          # Packaging fix (required)
          [ -f "$PATCH_SRC/0300-packaging-armbian-builddeb.patch" ] && \
            cp -v "$PATCH_SRC/0300-packaging-armbian-builddeb.patch" "$PATCH_DST/"

          # Optional patches — copy if present
          for p in \
            "$PATCH_SRC/0001-axp8191-step-cpu-rail-voltage-transitions.patch" \
            "$PATCH_SRC/0003-allwinner-a733-cedrus-vpu-support.patch" \
            "$PATCH_SRC/0004-sunxi-drm-edp-silence-hpd-polling-spam.patch" \
            "$PATCH_SRC/0210-a733-orangepi-4-pro-rgmii-delay.patch" \
            "$PATCH_SRC/0215-workqueue-guard-null-task-kick-pool.patch" \
            "$PATCH_SRC/0230-a733-orangepi-4-pro-1.4.4-fixes.patch" \
          ; do
            [ -f "$p" ] && cp -v "$p" "$PATCH_DST/" || true
          done

          echo "=== Kernel patches staged ==="
          ls -1 "$PATCH_DST/"

      # -----------------------------------------------------------------------
      - name: Inject A733 U-Boot patches
        run: |
          UBOOT_DST="orangepi-build/external/patch/u-boot/u-boot-sunxi"
          mkdir -p "$UBOOT_DST"
          if ls a733-patches/patch/u-boot/u-boot-sunxi/*.patch 1>/dev/null 2>&1; then
            cp -v a733-patches/patch/u-boot/u-boot-sunxi/*.patch "$UBOOT_DST/"
          fi

      # -----------------------------------------------------------------------
      - name: Inject A733 kernel defconfig
        run: |
          mkdir -p orangepi-build/external/config/kernel
          # BRANCH=next → orangepi-build looks for linux-sun60iw2-next-a733.config
          # (orangepi-build.patch configures LINUXCONFIG=linux-sun60iw2-next-a733
          #  for orangepi4pro boards with BRANCH=next)
          cp -v a733-patches/config/orangepi_4pro_defconfig \
            orangepi-build/external/config/kernel/linux-sun60iw2-next-a733.config

      # -----------------------------------------------------------------------
      - name: Inject BSP overlay files
        run: |
          if [ -d a733-patches/overlay ]; then
            mkdir -p orangepi-build/external/packages/bsp/common
            cp -rv a733-patches/overlay/. \
              orangepi-build/external/packages/bsp/common/ || true
          fi

      # -----------------------------------------------------------------------
      - name: Resolve build parameters
        id: params
        run: |
          RELEASE="${{ inputs.release || 'resolute' }}"
          FLAVOUR="${{ inputs.flavour || 'desktop-xfce' }}"
          TARGET="${{ inputs.target_storage || 'sd' }}"

          BUILD_MINIMAL="no"
          BUILD_DESKTOP="no"
          DESKTOP_ENV=""
          DESKTOP_ARGS=""

          case "$FLAVOUR" in
            minimal)
              BUILD_MINIMAL="yes"
              ;;
            server)
              BUILD_MINIMAL="no"
              ;;
            desktop-xfce)
              BUILD_DESKTOP="yes"
              DESKTOP_ENV="xfce"
              DESKTOP_ARGS="DESKTOP_ENVIRONMENT=xfce DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
            desktop-gnome)
              BUILD_DESKTOP="yes"
              DESKTOP_ENV="gnome"
              DESKTOP_ARGS="DESKTOP_ENVIRONMENT=gnome DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
            desktop-lxqt)
              BUILD_DESKTOP="yes"
              DESKTOP_ENV="lxqt"
              DESKTOP_ARGS="DESKTOP_ENVIRONMENT=lxqt DESKTOP_ENVIRONMENT_CONFIG_NAME=config_base DESKTOP_APPGROUPS_SELECTED="
              ;;
          esac

          echo "release=$RELEASE"             >> $GITHUB_OUTPUT
          echo "flavour=$FLAVOUR"             >> $GITHUB_OUTPUT
          echo "target=$TARGET"               >> $GITHUB_OUTPUT
          echo "build_minimal=$BUILD_MINIMAL" >> $GITHUB_OUTPUT
          echo "build_desktop=$BUILD_DESKTOP" >> $GITHUB_OUTPUT
          echo "desktop_args=$DESKTOP_ARGS"   >> $GITHUB_OUTPUT

          echo "### Build Parameters" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"      >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"      >> $GITHUB_STEP_SUMMARY
          echo "| Release | \`$RELEASE\` |"  >> $GITHUB_STEP_SUMMARY
          echo "| Flavour | \`$FLAVOUR\` |"  >> $GITHUB_STEP_SUMMARY
          echo "| Storage | \`$TARGET\` |"   >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      # Print every custom config variable before the build script initializes
      - name: Print custom config variables
        run: |
          echo "============================================================"
          echo "  CUSTOM BUILD CONFIG — resolved before orangepi-build init"
          echo "============================================================"
          echo ""
          echo "  ── Board / Kernel ──────────────────────────────────────"
          echo "  BOARD                           = orangepi4pro"
          echo "  BRANCH                          = next  (mainline Linux 6.18.y via orangepi-build.patch)"
          echo "  BUILD_OPT                       = image"
          echo ""
          echo "  ── OS / Desktop ─────────────────────────────────────────"
          echo "  RELEASE                         = ${{ steps.params.outputs.release }}"
          echo "  BUILD_MINIMAL                   = ${{ steps.params.outputs.build_minimal }}"
          echo "  BUILD_DESKTOP                   = ${{ steps.params.outputs.build_desktop }}"
          DESKTOP_ARGS="${{ steps.params.outputs.desktop_args }}"
          if [ -n "$DESKTOP_ARGS" ]; then
            # Print each key=value on its own indented line
            for kv in $DESKTOP_ARGS; do
              echo "  ${kv%%=*}$(printf '%*s' $((32 - ${#kv%%=*})) '')= ${kv#*=}"
            done
          else
            echo "  DESKTOP_ENVIRONMENT             = (none — server/minimal)"
          fi
          echo ""
          echo "  ── Build flags ──────────────────────────────────────────"
          echo "  NO_HOST_RELEASE_CHECK           = yes"
          echo "  EXPERT                          = yes"
          echo "  COMPILE_WIREGUARD               = no"
          echo "  INSTALL_WIREGUARD               = no"
          echo "  SKIP_EXTERNAL_TOOLCHAINS        = yes"
          echo ""
          echo "  ── Dispatch inputs ──────────────────────────────────────"
          echo "  inputs.release                  = ${{ inputs.release || '(default: resolute)' }}"
          echo "  inputs.flavour                  = ${{ inputs.flavour || '(default: desktop-xfce)' }}"
          echo "  inputs.target_storage           = ${{ inputs.target_storage || '(default: sd)' }}"
          echo "  inputs.publish_release          = ${{ inputs.publish_release }}"
          echo ""
          echo "  ── Patches injected ─────────────────────────────────────"
          echo "  Patch source  : jonas5/Allwinner-A733-kernel"
          echo "  Kernel patches:"
          ls -1 orangepi-build/external/patch/kernel/sun60iw2-next/ 2>/dev/null | sed 's/^/    /'
          echo "  U-Boot patches:"
          ls -1 orangepi-build/external/patch/u-boot/u-boot-sunxi/ 2>/dev/null | sed 's/^/    /' || echo "    (none)"
          echo "  Defconfig     : linux-sun60iw2-next-a733.config"
          echo ""
          echo "============================================================"

          # Also append to the step summary
          {
            echo "### ⚙️ Custom Config Variables"
            echo "| Variable | Value |"
            echo "|---|---|"
            echo "| \`BOARD\` | \`orangepi4pro\` |"
            echo "| \`BRANCH\` | \`next\` (mainline Linux 6.18.y via orangepi-build.patch) |"
            echo "| \`BUILD_OPT\` | \`image\` |"
            echo "| \`RELEASE\` | \`${{ steps.params.outputs.release }}\` |"
            echo "| \`BUILD_MINIMAL\` | \`${{ steps.params.outputs.build_minimal }}\` |"
            echo "| \`BUILD_DESKTOP\` | \`${{ steps.params.outputs.build_desktop }}\` |"
            if [ -n "$DESKTOP_ARGS" ]; then
              for kv in $DESKTOP_ARGS; do
                echo "| \`${kv%%=*}\` | \`${kv#*=}\` |"
              done
            fi
            echo "| \`NO_HOST_RELEASE_CHECK\` | \`yes\` |"
            echo "| \`EXPERT\` | \`yes\` |"
            echo "| \`COMPILE_WIREGUARD\` | \`no\` |"
            echo "| \`INSTALL_WIREGUARD\` | \`no\` |"
            echo "| \`SKIP_EXTERNAL_TOOLCHAINS\` | \`yes\` |"
          } >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      - name: Build SD card image
        run: |
          cd orangepi-build
          # BRANCH=next → mainline Linux 6.18.y, enabled by orangepi-build.patch
          #   which adds 'next' to the orangepi4pro board config and sun60iw2.conf.
          # SKIP_EXTERNAL_TOOLCHAINS=yes → find_toolchain() falls back to /usr/bin
          #   so the GCC 11 wrapper + alternatives set above are picked up.
          sudo ./build.sh \
            BOARD=orangepi4pro \
            BRANCH=next \
            BUILD_OPT=image \
            RELEASE=${{ steps.params.outputs.release }} \
            BUILD_MINIMAL=${{ steps.params.outputs.build_minimal }} \
            BUILD_DESKTOP=${{ steps.params.outputs.build_desktop }} \
            ${{ steps.params.outputs.desktop_args }} \
            NO_HOST_RELEASE_CHECK=yes \
            EXPERT=yes \
            COMPILE_WIREGUARD=no \
            INSTALL_WIREGUARD=no \
            SKIP_EXTERNAL_TOOLCHAINS=yes

      # -----------------------------------------------------------------------
      - name: Dump build logs on failure
        if: failure()
        run: |
          echo "=== compilation.log (last 200 lines) ==="
          sudo cat orangepi-build/output/debug/compilation.log 2>/dev/null | tail -200 || echo "(no compilation.log)"
          echo ""
          echo "=== All debug logs ==="
          sudo ls -lh orangepi-build/output/debug/ 2>/dev/null || echo "(no debug dir)"
          echo ""
          echo "=== U-Boot source tree (what files exist) ==="
          find orangepi-build/.tmp/ -name "*.fex" -o -name "u-boot.bin" -o -name "u-boot-sunxi*" 2>/dev/null | head -30 || echo "(no .tmp)"
          echo ""
          echo "=== arm-linux-gnueabi-gcc version ==="
          arm-linux-gnueabi-gcc-11 --version || true
          arm-linux-gnueabi-gcc --version || true
          which arm-linux-gnueabi-gcc || true

      # -----------------------------------------------------------------------
      - name: Post-process — apply A733 boot scripts to image
        run: |
          BASE_IMG=$(find orangepi-build/output/ -type f -name "*.img" | grep -v nvme | head -1)
          if [ -z "$BASE_IMG" ]; then
            echo "ERROR: No .img found in output/"; find orangepi-build/output/ -ls; exit 1
          fi
          echo "Post-processing: $BASE_IMG"

          LOOP=$(sudo losetup -fP --show "$BASE_IMG")
          sudo mkdir -p /mnt/opi-root
          sudo mount "${LOOP}p1" /mnt/opi-root

          [ -f a733-patches/boot/boot.cmd ] && sudo cp -v a733-patches/boot/boot.cmd /mnt/opi-root/boot/ || true
          [ -f a733-patches/boot/boot.scr ] && sudo cp -v a733-patches/boot/boot.scr /mnt/opi-root/boot/ || true
          [ -f a733-patches/boot/orangepiEnv.txt ] && sudo cp -v a733-patches/boot/orangepiEnv.txt /mnt/opi-root/boot/ || true

          sudo sync
          sudo umount /mnt/opi-root
          sudo losetup -d "$LOOP"

      # -----------------------------------------------------------------------
      - name: Generate NVMe variant (if requested)
        if: steps.params.outputs.target == 'nvme' || steps.params.outputs.target == 'both'
        run: |
          BASE_IMG=$(find orangepi-build/output/ -type f -name "*.img" | grep -v nvme | head -1)
          if [ -n "$BASE_IMG" ]; then
            NVME_IMG="${BASE_IMG%.img}-nvme.img"
            cp -v "$BASE_IMG" "$NVME_IMG"
            LOOP=$(sudo losetup -Pf --show "$NVME_IMG")
            sudo mkdir -p /mnt/nvme-ci
            sudo mount "${LOOP}p1" /mnt/nvme-ci
            sudo sed -i 's|rootdev=.*|rootdev=/dev/nvme0n1p1|g' /mnt/nvme-ci/boot/orangepiEnv.txt 2>/dev/null || true
            sudo sed -i 's|/dev/mmcblk0p1|/dev/nvme0n1p1|g'   /mnt/nvme-ci/etc/fstab 2>/dev/null || true
            sudo sync; sudo umount /mnt/nvme-ci; sudo losetup -d "$LOOP"
          fi

      # -----------------------------------------------------------------------
      - name: Package artifacts
        id: artifacts
        run: |
          mkdir -p release_artifacts
          RELEASE="${{ steps.params.outputs.release }}"
          FLAVOUR="${{ steps.params.outputs.flavour }}"
          DATE=$(date -u +%Y%m%d)

          for img in $(find orangepi-build/output/ -type f -name "*.img"); do
            base=$(basename "$img")
            # Rename to include release + flavour + date
            newname="OrangePi4Pro_${RELEASE}_${FLAVOUR}_linux6.6_${DATE}.img"
            [ "$(echo "$img" | grep -c nvme)" -gt 0 ] && newname="${newname%.img}-nvme.img"
            echo "Compressing $base → $newname.xz"
            xz -T0 -6 -c "$img" > "release_artifacts/${newname}.xz"
            (cd release_artifacts && sha256sum "${newname}.xz" > "${newname}.xz.sha256")
          done

          # Collect .deb packages
          if [ -d orangepi-build/output/debs ]; then
            find orangepi-build/output/debs/ -name "*.deb" | while read deb; do
              cp -v "$deb" release_artifacts/
            done
          fi

          (cd release_artifacts && sha256sum * > SHA256SUMS 2>/dev/null || true)

          echo "=== Release artifacts ==="
          ls -lh release_artifacts/

          echo "artifact_dir=release_artifacts" >> $GITHUB_OUTPUT

          echo "### Release Artifacts" >> $GITHUB_STEP_SUMMARY
          echo '```'                   >> $GITHUB_STEP_SUMMARY
          ls -lh release_artifacts/   >> $GITHUB_STEP_SUMMARY
          echo '```'                   >> $GITHUB_STEP_SUMMARY

      # -----------------------------------------------------------------------
      - name: Upload CI artifact (always available for 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: opi4pro-${{ steps.params.outputs.release }}-${{ steps.params.outputs.flavour }}
          path: release_artifacts/*
          if-no-files-found: error
          retention-days: 90

      # -----------------------------------------------------------------------
      - name: Publish GitHub Release
        if: inputs.publish_release != false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE="${{ steps.params.outputs.release }}"
          FLAVOUR="${{ steps.params.outputs.flavour }}"
          DATE=$(date -u +%Y-%m-%d)
          TAG="$(date -u +%Y%m%d)-${RELEASE}-${FLAVOUR}"
          TITLE="OrangePi 4 Pro — ${RELEASE^^} ${FLAVOUR} (${DATE})"

          cat > release_notes.md << EOF
          ## Orange Pi 4 Pro — ${TITLE}

          | | |
          |---|---|
          | **SoC** | Allwinner A733 (\`sun60iw2\`) |
          | **Kernel** | Linux 6.6.y OrangePi kernel + A733 patches |
          | **OS** | Ubuntu ${RELEASE^} |
          | **Desktop** | ${FLAVOUR} |
          | **Build date** | ${DATE} |

          ### Default credentials
          - User: \`orangepi\` / \`orangepi\` (sudo access)
          - Root: \`root\` / \`orangepi\`

          ### Flash instructions
          Use [Armbian Imager](https://www.armbian.com/download/) or \`dd\`:
          \`\`\`bash
          xzcat OrangePi4Pro_*.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          \`\`\`

          ### Verify
          Check \`SHA256SUMS\` or the matching \`.sha256\` file for each asset.

          ### Hardware support (Linux 6.6 OrangePi + A733 patches)
          - ✅ CPU / DVFS — 6× Cortex-A55 + 2× Cortex-A76
          - ✅ Ethernet — Motorcomm YT8531 GbE
          - ✅ MicroSD — SDC0 (/dev/mmcblk0)
          - ✅ HDMI — Allwinner Display Engine / sunxi-drm
          - ✅ GPU — PowerVR Rogue BXM-4-64 (Mesa open Vulkan)
          - ✅ Wi-Fi 6 — AIC8800D80 SDIO (install driver pack post-boot)
          - ✅ Bluetooth — AIC8800D80 UART HCI
          - ✅ VPU — Cedar + Cedrus V4L2 stateless (4K H.265)
          - ✅ NPU — VeriSilicon VIP9000 (3 TOPS)
          EOF

          # Create or update release
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release_notes.md \
              --prerelease
          else
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release_notes.md
          fi

          # Upload all artifacts with retry
          for asset in release_artifacts/*; do
            [ -f "$asset" ] || continue
            for attempt in 1 2 3; do
              gh release upload "$TAG" "$asset" --clobber && break
              echo "Retry $attempt/3 for $(basename $asset)..."; sleep 5
            done
          done

          echo "### ✅ Release published: [$TAG](https://github.com/${{ github.repository }}/releases/tag/${TAG})" \
            >> $GITHUB_STEP_SUMMARY
